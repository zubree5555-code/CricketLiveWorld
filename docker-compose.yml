services:
  postgres:
    image: postgres:16
    container_name: cricketlive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cricketlive
      POSTGRES_PASSWORD: cricketlive_dev_password
      POSTGRES_DB: cricketlive
    ports:
      - "5432:5432"
    volumes:
      - cricketlive_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cricketlive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  cricketlive_pg_data:
